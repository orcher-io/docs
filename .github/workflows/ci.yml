name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Typecheck, build, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:links

  samples:
    name: Code samples
    runs-on: ubuntu-latest
    env:
      # Pin the CLI the docs are checked against; bump it deliberately.
      ORCHER_CLI: uvx --from orcher==0.1.1 orcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: samples/rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # Enforces pages listed in samples/checked-pages.txt and reports the rest;
      # switch to `--strict` once every page is listed.
      - run: bash scripts/check-samples.sh
