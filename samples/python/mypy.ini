# Strict enough that a sample using an SDK name that does not exist, or calling
# it with the wrong arguments, fails. orcher-sdk ships py.typed, so imports
# from it resolve against the installed package.
[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = False
warn_unreachable = True
# Sample code shows untyped dict payloads in places; keep those readable.
disallow_any_generics = False
